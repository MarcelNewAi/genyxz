<svg width="420" height="900" viewBox="0 0 420 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .helix-strand-a,
      .helix-strand-b {
        stroke-dasharray: 12 8;
      }

      .helix-strand-a {
        animation: helixFlow 4s linear infinite;
      }

      .helix-strand-b {
        animation: helixFlow 4s linear infinite reverse;
      }

      @keyframes helixFlow {
        from {
          stroke-dashoffset: 0;
        }

        to {
          stroke-dashoffset: -40;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .helix-strand-a,
        .helix-strand-b {
          animation: none;
        }
      }
    </style>
    <linearGradient id="helixGradientA" x1="120" y1="80" x2="300" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BAEBA" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2BAEBA" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#7E2392" stop-opacity="0.9"/>
      <stop offset="0.82" stop-color="#2BAEBA" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7E2392" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="helixGradientB" x1="300" y1="80" x2="120" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E2392" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2BAEBA" stop-opacity="0.66"/>
      <stop offset="0.5" stop-color="#7E2392" stop-opacity="0.88"/>
      <stop offset="0.82" stop-color="#2BAEBA" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2BAEBA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rungGradient" x1="135" y1="0" x2="285" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BAEBA" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#7E2392" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#2BAEBA" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
